<!DOCTYPE html>
<html lang="ko">

})(window,document,'script','dataLayer','GTM-TS2C9QH4');</script>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>WBTI — Wine Base Taste Index</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1 : COVER
     ──────────────────────────────────────────
     레이어 구조:
       [0] cover_bg.png  — 전체 배경 이미지
       [1] btn_start.png — 시작 버튼 (중앙 하단, 150px)
══════════════════════════════════════════ -->
<section id="screen-cover" class="screen active">

  <img
    class="cover-bg"
    src="images/cover_bg.png"
    alt="WBTI 커버 배경"
    onerror="this.style.background='#f4f1eb'"
  />

  <!--
    버튼 위치: top 68% 기준 (커버 이미지의 16문항·3분소요 텍스트 아래)
    top 값을 조정하면 버튼 위치가 올라가거나 내려갑니다.
  -->
  <div class="cover-btn-wrap">
    <button class="btn-start" onclick="startQuiz()" aria-label="테스트 시작">
      <img
        src="images/ui/btn_start.png"
        alt="TEST START"
        class="btn-start-img"
        onerror="this.style.display='none';
                 this.nextElementSibling.style.display='block';"
      />
      <span class="btn-start-fallback" style="display:none;">TEST START</span>
    </button>
  </div>

</section>


<!-- ══════════════════════════════════════════
     SCREEN 2 : QUIZ
     ──────────────────────────────────────────
     레이어 구조:
       [0] quiz_bg.png           — 전체 배경 (없으면 CSS 크림+원형패턴 fallback)
       [1] WBTI 로고 + 챕터 + 진행바
       [2] 이전 버튼 (왼쪽, 라운드)
       [3] clipboard_card.png    — 클립보드 카드 배경 (876×820)
           └ 카드 위: 질문번호 + 질문 텍스트 + 일러스트 (슬라이드 애니메이션)
       [4] 선택지 A / B 버튼
══════════════════════════════════════════ -->
<section id="screen-quiz" class="screen">

  <!-- 퀴즈 전체 배경 이미지 (없으면 CSS fallback 자동 표시) -->
  <img
    class="quiz-bg-img"
    src="images/quiz_bg.png"
    alt=""
    aria-hidden="true"
    onload="this.closest('#screen-quiz').classList.add('has-bg')"
    onerror="this.remove()"
  />
  <!-- CSS 원형 패턴 fallback (quiz_bg.png 없을 때 표시) -->
  <div class="quiz-pattern" aria-hidden="true"></div>

  <!-- 헤더: WBTI 로고 + 챕터명 + 진행바 + 카운터 -->
  <div class="quiz-header">
    <!--
      ★ 3번: 로고 이미지 파일
      파일 위치: images/ui/logo.png
      (images/ui/ 폴더에 logo.png 를 넣으면 자동 적용)
      이미지 없을 때 텍스트 fallback 자동 표시
    -->
    <div class="quiz-logo-wrap">
      <img
        src="images/ui/logo.png"
        alt="WBTI"
        class="quiz-logo-img"
        onerror="this.style.display='none';
                 this.nextElementSibling.style.display='block';"
      />
      <div class="quiz-logo" style="display:none;">WBTI</div>
    </div>
    <div class="chapter-step-wrap">
      <div class="chapter-label" id="chapter-label-text">Chapter 1. 당도</div>
      <div class="step-bar-wrap">
        <div id="step-track"></div>
        <span class="step-counter" id="step-counter">1 / 16</span>
      </div>
    </div>
  </div>

  <!--
    이전 버튼:
    - Q1(idx=0)에서 누르면 커버 화면으로 이동
    - Q2 이후에서 누르면 이전 질문으로 이동
    - 챕터 색상(--ch-current)에 연동된 화살표
  -->
  <div class="btn-back-wrap">
    <button id="btn-back" onclick="goPrev()" aria-label="이전으로">
      이전
    </button>
  </div>

  <!--
    클립보드 카드:
    - clipboard_card.png (876×820)가 배경 이미지
    - background: transparent → 흰 박스 없음
    - 카드 내부에 질문 콘텐츠가 절대 배치됨
  -->
  <div class="clipboard-wrap" id="quiz-card">

    <!-- 클립+종이 배경 이미지 -->
    <img
      class="clipboard-bg-img"
      src="images/ui/clipboard_card.png"
      alt=""
      aria-hidden="true"
      onerror="this.style.display='none';
               document.getElementById('clipboard-css-fallback').style.display='block';"
    />

    <!-- CSS fallback: clipboard_card.png 없을 때 흰 카드 + 딥그린 클립 -->
    <div id="clipboard-css-fallback" class="clipboard-css-fallback" style="display:none;">
      <div class="clip-fallback-css" aria-hidden="true"></div>
    </div>

    <!--
      슬라이드 애니메이션 대상:
      질문번호(Q1~Q16) + 상황 설명 + 질문 텍스트 + 일러스트
      클립보드 이미지는 고정, 이 영역만 좌우 슬라이드
    -->
    <div class="card-content-wrap" id="card-content">

      <!-- 상황 설명: 화이트 컨테이너 배경 -->
      <p class="q-situation" id="q-situation"></p>

      <!--
        질문 텍스트:
        JS에서 innerHTML으로
        <span class="q-number">Q1</span>질문내용
        형태로 주입됨
      -->
      <p class="q-text" id="q-text"></p>

      <!--
        일러스트 영역:
        images/illustrations/q01_popcorn.png 등
        432×432 기준, 딥그린 18% 테두리
      -->
      <div class="illust-area">
        <img id="q-illust" src="" alt="질문 일러스트" decoding="async" loading="lazy" />
      </div>

    </div><!-- /.card-content-wrap -->

  </div><!-- /.clipboard-wrap -->

  <!-- 선택지 구분 텍스트 -->
  <div class="options-header" aria-hidden="true">선택지를 골라주세요</div>

  <!--
    선택지 A / B 버튼:
    JS의 renderOptions()가 동적으로 생성
    선택 전: 흰 배경 + 딥그린 테두리
    선택 후: 딥그린 채움 + 크림 텍스트
  -->
  <div id="options-wrap" role="group" aria-label="선택지"></div>

</section>


<!-- ══════════════════════════════════════════
     SCREEN 3 : LOADING
     ──────────────────────────────────────────
     와인잔 SVG 채우기 애니메이션 (1.8초)
     완료 후 결과 계산 → SCREEN 4 전환
══════════════════════════════════════════ -->
<section id="screen-loading" class="screen" aria-live="polite" aria-label="결과 분석 중">

  <div class="wine-glass-wrap">

    <!-- 와인잔 SVG: 아래에서 위로 채워지는 애니메이션 -->
    <svg
      width="72" height="100" viewBox="0 0 72 100"
      fill="none" xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <clipPath id="glass-clip">
          <path d="M10 14 Q10 68 36 68 Q62 68 62 14 Z"/>
        </clipPath>
      </defs>
      <!-- 와인 채우기 rect (CSS 애니메이션으로 height 0→40) -->
      <rect
        id="wine-fill-rect"
        x="10" y="60" width="52" height="0"
        fill="#9b2226" opacity="0.75"
        clip-path="url(#glass-clip)"
      />
      <!-- 잔 외형 -->
      <path
        d="M10 14 Q10 68 36 68 Q62 68 62 14 Z"
        stroke="#1a3a2a" stroke-width="1.8" fill="none"
      />
      <!-- 잔 스템 -->
      <line x1="36" y1="68" x2="36" y2="90"
            stroke="#1a3a2a" stroke-width="1.8"/>
      <!-- 잔 베이스 -->
      <line x1="18" y1="90" x2="54" y2="90"
            stroke="#1a3a2a" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <!-- 2번: 로딩 로고 이미지 (images/ui/logo.png) -->
    <div class="loading-logo-wrap">
      <img
        src="images/ui/logo.png"
        alt="WBTI"
        class="loading-logo-img"
        onerror="this.style.display='none';
                 this.nextElementSibling.style.display='block';"
      />
      <div class="loading-title" style="display:none;">WBTI</div>
    </div>
    <div class="loading-sub">나의 와인을 찾는 중…</div>

  </div>

</section>


<!-- ══════════════════════════════════════════
     SCREEN 4 : RESULT
     ──────────────────────────────────────────
     레이어 구조:
       .receipt { background-image: receipt_bg.png }
         └ .receipt-inner (텍스트 콘텐츠)
              ├ WBTI 로고
              ├ 캐릭터 이미지 (images/characters/{CODE}_c.png)
              ├ 캐릭터 이름 + 원산지
              ├ TASTE PROFILE: 4축 게이지
              ├ EXPLANATION: 결과 설명
              ├ WINE RECOMMENDATION: 추천 와인 1종
              │   └ 와인 이미지 (images/wines/{CODE}.png)
              └ 바코드 + 날짜
══════════════════════════════════════════ -->
<section id="screen-result" class="screen">

  <!-- 상단 헤더: Your Result + 다시하기 버튼 -->
  <div class="result-header-bar">
    <button class="btn-retry" onclick="retryQuiz()">↺ Retry</button>
  </div>

  <!--
    영수증 카드:
    receipt_bg.png → CSS background-image (100% 100%)
    HTML <img> 태그 사용 안 함 → 배경·텍스트 분리 방지
  -->
  <div class="receipt" id="receipt-card">
    <div class="receipt-inner">

      <!-- WBTI 로고 (4번: 이미지로 대체) -->
      <div class="rc-logo-row">
        <img
          src="images/ui/logo.png"
          alt="WBTI"
          class="rc-logo-img"
          onerror="this.style.display='none';
                   this.nextElementSibling.style.display='inline-block';"
        />
        <span class="rc-logo" id="result-logo" style="display:none;">WBTI</span>
      </div>

      <!-- 캐릭터 이미지 + 이름 + 원산지 -->
      <div class="rc-char-block">
        <div class="rc-char-img-wrap">
          <!--
            images/characters/{CODE}_c.png
            없으면 이모지 fallback 자동 표시
          -->
          <img
            id="result-char-img"
            src=""
            alt="캐릭터"
            class="rc-char-img"
            onerror="this.style.display='none';
                     var fb=document.getElementById('result-char-fallback');
                     if(fb){ fb.style.display='flex'; }"
          />
          <!-- ★ 9번: 이미지 없을 때 이모지 fallback -->
          <div id="result-char-fallback"
               style="display:none;font-size:72px;line-height:1;
                      width:160px;height:160px;
                      align-items:center;justify-content:center;
                      justify-content:center;">
            🍷
          </div>
        </div>
        <div class="rc-char-name"   id="result-char-name">—</div>
        <div class="rc-char-origin" id="result-char-origin">—</div>
      </div>

      <!-- TASTE PROFILE: 4축 게이지 (JS가 동적 생성) -->
      <div class="rc-section">
        <div class="rc-section-label-row">
          <span class="rc-section-label">TASTE PROFILE</span>
        </div>
        <div class="rc-divider"></div>
        <!--
          JS renderResult()가 rc-axes 안에 아래 구조를 16번 반복 생성:
          <div class="rc-axis-item">
            <div class="rc-axis-top-row">
              <span class="rc-axis-name">1. 당도</span>
              <span class="rc-axis-pct">12%</span>
            </div>
            <div class="rc-axis-bar-track">
              <div class="rc-axis-bar-fill" style="width:12%"></div>
            </div>
            <div class="rc-axis-bottom-row">
              <span class="rc-axis-label-lo">스위트</span>
              <span class="rc-axis-label-hi">드라이</span>
            </div>
          </div>
        -->
        <div class="rc-axes" id="result-axes"></div>
      </div>

      <!-- EXPLANATION: 결과 설명 텍스트 -->
      <div class="rc-section">
        <div class="rc-section-label-row">
          <span class="rc-section-label">EXPLANATION</span>
        </div>
        <div class="rc-divider"></div>
        <p class="rc-explanation" id="result-feature">—</p>
      </div>

      <!-- WINE RECOMMENDATION: 소믈리에 추천 와인 1종 -->
      <div class="rc-section rc-section-last">
        <div class="rc-section-label-row">
          <span class="rc-section-label">WINE RECOMMENDATION</span>
        </div>
        <div class="rc-divider"></div>

        <div class="rc-wine-item" id="rc-wine-1">
          <div class="rc-wine-img-wrap">
            <!--
              images/wines/{CODE}.png
              없으면 img 요소만 숨김 (레이아웃 유지)
            -->
            <img
              class="rc-wine-img"
              id="result-wine-img-1"
              src=""
              alt="추천 와인"
              onerror="this.style.display='none';"
            />
          </div>
          <div class="rc-wine-info">
            <div class="rc-wine-name"    id="result-wine1-name">—</div>
            <div class="rc-wine-origin"  id="result-wine1-origin">—</div>
            <div class="rc-wine-feature" id="result-wine1-feature">—</div>
          </div>
        </div>

        <!--
          2번째 와인 항목: JS에서 style.display='none'으로 숨김
          (1종 추천 정책에 따라 렌더링 시 자동 비활성화)
        -->
        <div class="rc-wine-item" id="rc-wine-2" style="display:none;"></div>

      </div><!-- /.rc-section-last -->

      <!-- 바코드 + 날짜 -->
      <div class="rc-footer">
        <div class="rc-barcode-wrap">
          <!--
            images/ui/barcode.png
            없으면 텍스트 바코드 fallback 자동 표시
          -->
          <img
            src="images/ui/barcode.png"
            alt=""
            class="rc-barcode-img"
            aria-hidden="true"
            onerror="this.style.display='none';
                     document.getElementById('rc-barcode-fallback').style.display='block';"
          />
          <div
            id="rc-barcode-fallback"
            class="rc-barcode-fallback"
            style="display:none;"
            aria-hidden="true"
          >
            | || ||| | || ||| | || || | | ||| | || || | | ||| | || || |
          </div>
        </div>
        <!-- 날짜: JS에서 "2026.05.28 – WINE PAIRING" 형식으로 주입 -->
        <div class="rc-date-row" id="result-date">—</div>
      </div>

    </div><!-- /.receipt-inner -->
  </div><!-- /#receipt-card -->

  <!--
    액션 버튼:
    갤러리 저장 — Android/PC: PNG 다운로드, iOS: 새탭에서 열기
    인스타 공유 — Web Share API 지원 시 이미지 직접 공유,
                  미지원 시 텍스트 클립보드 복사 fallback
  -->
  <div class="result-actions">
    <button
      id="btn-save"
      class="btn-action btn-save"
      onclick="saveImage()"
      aria-label="이미지를 갤러리에 저장"
    >
      <span class="btn-action-icon">⬇</span>갤러리 저장
    </button>
    <button
      id="btn-share-insta"
      class="btn-action btn-share-insta"
      onclick="shareInstagram()"
      aria-label="인스타그램에 공유"
    >
      <span class="btn-action-icon">📸</span>인스타 공유
    </button>
  </div>

</section>


<!-- 토스트 메시지 (저장/공유 결과 알림) -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--
  스크립트 로드 순서:
  1. data.js  — CHAPTERS, questions, results 데이터
  2. app.js   — 퀴즈 로직, 렌더링, 저장/공유
  3. html2canvas — 결과 이미지 생성 (갤러리 저장/인스타 공유용)
-->
<script src="js/data.js?v=5"></script>
<script src="js/app.js?v=7"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
