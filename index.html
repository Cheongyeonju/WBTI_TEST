<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>WBTI — Wine Base Taste Index</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1 : COVER
══════════════════════════════════════════ -->
<section id="screen-cover" class="screen active">

  <div class="lang-toggle" id="lang-toggle">
    <button id="btn-lang-ko" class="lang-btn active" onclick="setLang('ko')">KR</button>
    <span class="lang-divider">/</span>
    <button id="btn-lang-en" class="lang-btn" onclick="setLang('en')">ENG</button>
  </div>

  <img
    id="cover-bg-img"
    class="cover-bg"
    src="images/cover.kr_bg.png"
    alt="WBTI 커버 배경"
    onerror="this.style.background='#f4f1eb'"
  />

  <div class="cover-btn-wrap">
    <button class="btn-start" onclick="startQuiz()" aria-label="테스트 시작">
      <img
        src="images/ui/btn_start.png"
        alt="TEST START"
        class="btn-start-img"
        onerror="this.style.display='none';
                 this.nextElementSibling.style.display='block';"
      />
      <span class="btn-start-fallback" style="display:none;">TEST START</span>
    </button>
  </div>

</section>


<!-- ══════════════════════════════════════════
     SCREEN 1.5 : AGE SELECTION
══════════════════════════════════════════ -->
<section id="screen-age" class="screen">

  <img class="quiz-bg-img" src="images/quiz_bg.png" alt="" aria-hidden="true"
    onerror="this.remove()" />
  <div class="quiz-pattern" aria-hidden="true"></div>

  <div class="quiz-header">
    <div class="quiz-logo-wrap logo-clickable" onclick="showScreen('screen-cover')" role="button" aria-label="처음으로">
      <img src="images/ui/logo.png" alt="WBTI" class="quiz-logo-img"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
      <div class="quiz-logo" style="display:none;">WBTI</div>
    </div>
  </div>

  <div class="btn-back-wrap">
    <button id="btn-back-age" class="btn-back-shared"
            onclick="showScreen('screen-cover')" aria-label="커버로">
      <span id="age-back-label">이전</span>
    </button>
  </div>

  <div class="options-header" id="age-question-text">나이대가 어떻게 되시나요?</div>

  <div id="age-options-wrap" role="group" aria-label="나이대 선택">
    <button class="option-btn age-btn" onclick="selectAge('20대')">
      <div class="option-letter">1</div>
      <div class="option-text" id="age-label-1">20대</div>
    </button>
    <button class="option-btn age-btn" onclick="selectAge('30대')">
      <div class="option-letter">2</div>
      <div class="option-text" id="age-label-2">30대</div>
    </button>
    <button class="option-btn age-btn" onclick="selectAge('40대')">
      <div class="option-letter">3</div>
      <div class="option-text" id="age-label-3">40대</div>
    </button>
    <button class="option-btn age-btn" onclick="selectAge('50대')">
      <div class="option-letter">4</div>
      <div class="option-text" id="age-label-4">50대</div>
    </button>
    <button class="option-btn age-btn" onclick="selectAge('60세 이상')">
      <div class="option-letter">5</div>
      <div class="option-text" id="age-label-5">60세 이상</div>
    </button>
  </div>

</section>



<!-- ══════════════════════════════════════════
     SCREEN 2 : QUIZ
══════════════════════════════════════════ -->
<section id="screen-quiz" class="screen">

  <img
    class="quiz-bg-img"
    src="images/quiz_bg.png"
    alt=""
    aria-hidden="true"
    onload="this.closest('#screen-quiz').classList.add('has-bg')"
    onerror="this.remove()"
  />
  <div class="quiz-pattern" aria-hidden="true"></div>

  <div class="quiz-header">
    <div class="quiz-logo-wrap logo-clickable" onclick="showScreen('screen-cover')" role="button" aria-label="처음으로">
      <img
        src="images/ui/logo.png"
        alt="WBTI"
        class="quiz-logo-img"
        onerror="this.style.display='none';
                 this.nextElementSibling.style.display='block';"
      />
      <div class="quiz-logo" style="display:none;">WBTI</div>
    </div>
    <div class="chapter-step-wrap">
      <div class="chapter-label" id="chapter-label-text">Chapter 1. 당도</div>
      <div class="step-bar-wrap">
        <div id="step-track"></div>
        <span class="step-counter" id="step-counter">1 / 16</span>
      </div>
    </div>
  </div>

  <div class="btn-back-wrap">
    <button id="btn-back" onclick="goPrev()" aria-label="이전으로">
      이전
    </button>
  </div>

  <div class="clipboard-wrap" id="quiz-card">

    <img
      class="clipboard-bg-img"
      src="images/ui/clipboard_card.png"
      alt=""
      aria-hidden="true"
      onerror="this.style.display='none';
               document.getElementById('clipboard-css-fallback').style.display='block';"
    />

    <div id="clipboard-css-fallback" class="clipboard-css-fallback" style="display:none;">
      <div class="clip-fallback-css" aria-hidden="true"></div>
    </div>

    <div class="card-content-wrap" id="card-content">

      <p class="q-situation" id="q-situation"></p>
      <p class="q-text" id="q-text"></p>

      <div class="illust-area">
        <div id="illust-area-inner">
          <img id="illust-slot-a" src="" alt="" />
          <img id="illust-slot-b" src="" alt="" />
        </div>
      </div>

    </div><!-- /.card-content-wrap -->

  </div><!-- /.clipboard-wrap -->

  <div class="options-header" aria-hidden="true">선택지를 골라주세요</div>

  <div id="options-wrap" role="group" aria-label="선택지"></div>

</section>


<!-- ══════════════════════════════════════════
     SCREEN 3 : LOADING
══════════════════════════════════════════ -->
<section id="screen-loading" class="screen" aria-live="polite" aria-label="결과 분석 중">

  <div class="wine-glass-wrap">

    <svg
      width="72" height="100" viewBox="0 0 72 100"
      fill="none" xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <clipPath id="glass-clip">
          <path d="M10 14 Q10 68 36 68 Q62 68 62 14 Z"/>
        </clipPath>
      </defs>
      <rect
        id="wine-fill-rect"
        x="10" y="60" width="52" height="0"
        fill="#9b2226" opacity="0.75"
        clip-path="url(#glass-clip)"
      />
      <path
        d="M10 14 Q10 68 36 68 Q62 68 62 14 Z"
        stroke="#1a3a2a" stroke-width="1.8" fill="none"
      />
      <line x1="36" y1="68" x2="36" y2="90"
            stroke="#1a3a2a" stroke-width="1.8"/>
      <line x1="18" y1="90" x2="54" y2="90"
            stroke="#1a3a2a" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <div class="loading-logo-wrap">
      <img
        src="images/ui/logo.png"
        alt="WBTI"
        class="loading-logo-img"
        onerror="this.style.display='none';
                 this.nextElementSibling.style.display='block';"
      />
      <div class="loading-title" style="display:none;">WBTI</div>
    </div>
    <div class="loading-sub" id="loading-sub-text">나의 와인을 찾는 중…</div>

  </div>

</section>


<!-- ══════════════════════════════════════════
     SCREEN 4 : RESULT
══════════════════════════════════════════ -->
<section id="screen-result" class="screen">

  <!-- 상단 헤더: Retry 버튼만 (Your Result 제거됨) -->
  <div class="result-header-bar">
    <button class="btn-retry" onclick="retryQuiz()">↺ Retry</button>
  </div>

  <div class="receipt" id="receipt-card">
    <div class="receipt-inner">

      <!-- 결과 코드 표시 -->
      <div class="rc-logo-row">
        <!-- ✅ WBTI TEST 뱃지 — fill 없음, 그린 스트로크만 -->
        <div class="rc-wbti-badge-wrap">
          <span class="rc-wbti-badge">WBTI TEST</span>
        </div>
        <div class="rc-code" id="result-code-display">WBTI</div>
      </div>

      <!-- 캐릭터 이미지 + 이름 + 원산지 -->
      <div class="rc-char-block">
        <div class="rc-char-img-wrap">
          <img
            id="result-char-img"
            src=""
            alt="캐릭터"
            class="rc-char-img"
            onerror="this.style.display='none';
                     var fb=document.getElementById('result-char-fallback');
                     if(fb){ fb.style.display='flex'; }"
          />
          <div id="result-char-fallback"
               style="display:none;font-size:72px;line-height:1;
                      width:160px;height:160px;
                      align-items:center;justify-content:center;">
            🍷
          </div>
        </div>
        <div class="rc-char-name"   id="result-char-name">—</div>
        <div class="rc-char-origin" id="result-char-origin">—</div>
      </div>

      <!-- TASTE PROFILE -->
      <div class="rc-section">
        <div class="rc-section-label-row">
          <span class="rc-section-label">TASTE PROFILE</span>
        </div>
        <div class="rc-divider"></div>
        <div class="rc-axes" id="result-axes"></div>
      </div>

      <!-- EXPLANATION -->
      <div class="rc-section">
        <div class="rc-section-label-row">
          <span class="rc-section-label">EXPLANATION</span>
        </div>
        <div class="rc-divider"></div>
        <p class="rc-explanation" id="result-feature">—</p>
      </div>

      <!-- WINE RECOMMENDATION -->
      <div class="rc-section rc-section-last">
        <div class="rc-section-label-row">
          <span class="rc-section-label">WINE RECOMMENDATION</span>
        </div>
        <div class="rc-divider"></div>

        <div class="rc-wine-item" id="rc-wine-1" onclick="openWinePopup()" style="cursor:pointer;" role="button" aria-label="와인 상세 보기">
          <div class="rc-wine-img-wrap">
            <img
              class="rc-wine-img"
              id="result-wine-img-1"
              src=""
              alt="추천 와인"
              onerror="this.style.display='none';"
            />
          </div>
          <div class="rc-wine-info">
            <div class="rc-wine-name"    id="result-wine1-name">—</div>
            <div class="rc-wine-origin"  id="result-wine1-origin">—</div>
            <div class="rc-wine-feature" id="result-wine1-feature">—</div>
          </div>
        </div>

        <div class="rc-wine-item" id="rc-wine-2" style="display:none;"></div>

      </div><!-- /.rc-section-last -->

      <!-- 바코드 + 날짜 -->
      <div class="rc-footer">
        <div class="rc-divider"></div>
        <div class="rc-barcode-wrap">
          <img
            src="images/ui/barcode.png"
            alt=""
            class="rc-barcode-img"
            aria-hidden="true"
            onerror="this.style.display='none';
                     document.getElementById('rc-barcode-fallback').style.display='block';"
          />
          <div
            id="rc-barcode-fallback"
            class="rc-barcode-fallback"
            style="display:none;"
            aria-hidden="true"
          >
            | || ||| | || ||| | || || | | ||| | || || | | ||| | || || |
          </div>
        </div>
        <div class="rc-date-row" id="result-date">—</div>
      </div>

    </div><!-- /.receipt-inner -->
  </div><!-- /#receipt-card -->

  <div class="result-actions">
    <button
      id="btn-save"
      class="btn-action btn-save"
      onclick="saveImage()"
      aria-label="이미지를 갤러리에 저장"
    >
      <span class="btn-action-icon">⬇</span>갤러리 저장
    </button>
    <button
      id="btn-share-insta"
      class="btn-action btn-share-insta"
      onclick="openSharePopup()"
      aria-label="공유하기"
    >
      <span class="btn-action-icon">📤</span><span id="btn-share-label">공유하기</span>
    </button>
  </div>

</section>


<!-- ══════════════════════════════════════════
     SHARE POPUP
══════════════════════════════════════════ -->
<div id="share-popup" class="wine-popup-overlay" onclick="closeSharePopup()" style="display:none;">
  <div class="wine-popup-card share-popup-card" onclick="event.stopPropagation()">

    <button class="wine-popup-close" onclick="closeSharePopup()" aria-label="닫기">✕</button>

    <div class="share-popup-title" id="share-popup-title">공유하기</div>
    <div class="share-popup-desc"  id="share-popup-desc">나의 WBTI 결과를 공유해보세요</div>

    <div class="share-options">

      <button class="share-option-btn" onclick="shareKakao()" id="btn-share-kakao">
        <div class="share-option-icon kakao-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.7 1.6 5.1 4 6.6L4.8 21l4.2-2.4c1 .2 2 .4 3 .4 5.523 0 10-3.477 10-7.8S17.523 3 12 3z" fill="#3A1D1D"/>
          </svg>
        </div>
        <span id="share-kakao-label">카카오톡</span>
      </button>

      <button class="share-option-btn" onclick="shareToInstagram()" id="btn-share-ig">
        <div class="share-option-icon ig-icon">
          <span style="font-size:22px;">📷</span>
        </div>
        <span id="share-ig-label">인스타그램</span>
      </button>

      <button class="share-option-btn" onclick="copyLink()" id="btn-copy-link">
        <div class="share-option-icon link-icon">
          <span style="font-size:22px;">🔗</span>
        </div>
        <span id="share-link-label">링크 복사</span>
      </button>

    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════
     WINE DETAIL POPUP
══════════════════════════════════════════ -->
<div id="wine-popup" class="wine-popup-overlay" onclick="closeWinePopup()" style="display:none;" aria-modal="true" role="dialog">
  <div class="wine-popup-card" onclick="event.stopPropagation()">

    <button class="wine-popup-close" onclick="closeWinePopup()" aria-label="닫기">✕</button>

    <div class="wine-popup-img-wrap">
      <img id="popup-wine-img" src="" alt="와인" class="wine-popup-img"
        onerror="this.style.display='none';" />
    </div>

    <div class="wine-popup-body">
      <div class="wine-popup-name"    id="popup-wine-name">—</div>
      <div class="wine-popup-origin"  id="popup-wine-origin">—</div>
      <div class="wine-popup-grape"   id="popup-wine-grape">—</div>

      <div class="wine-popup-section-label" id="popup-tasting-label">테이스팅 노트</div>
      <div class="wine-popup-tasting" id="popup-wine-tasting">—</div>

      <div class="wine-popup-section-label" id="popup-pairing-label">추천 페어링</div>
      <div class="wine-popup-pairing" id="popup-wine-pairing">—</div>

      <!-- ✅ 가격 표시 → 비비노 검색 링크로 교체 (app.js의 buildVivinoSearchUrl이 href/text를 채움) -->
      <a class="wine-popup-price" id="popup-wine-price" href="https://www.vivino.com/" target="_blank" rel="noopener noreferrer">비비노에서 보기 →</a>
    </div>

  </div>
</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.6.0/kakao.min.js"></script>
<script src="js/data.js?v=5"></script>
<script src="js/app.js?v=10"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
